<!-- Worked example: sliders driving a Chart.js area curve with summary stats.
     Idioms on display: pinned CDN build; dshViz.bind wiring named controls
     to one render and its readouts; dshViz.chart applying the card style's
     chart defaults, drawing once fonts settle with the latest data and its
     free entrance, then updating in place; theme.fade for the soft gradient
     under the single measure; dshViz.fmt for readable numbers;
     data-viz-keep so the reader's settings survive a reload. -->
<div id="sim-cooling" data-viz-keep>
  <style>
    /* Layout idiom: label | slider | right-aligned bold value on one row;
       stats as bare label + large number, no boxes. */
    #sim-cooling .row { display: grid; grid-template-columns: 92px 1fr 72px; align-items: center; gap: 12px; margin-bottom: 10px; }
    #sim-cooling .row output { text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; }
    #sim-cooling .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
    #sim-cooling .stats { display: flex; flex-wrap: wrap; gap: 8px 40px; margin: 14px 0 10px; }
    #sim-cooling .stats .viz-stat-value { font-size: 1.5em; font-variant-numeric: tabular-nums; }
  </style>
  <div class="head">
    <h3 style="margin: 0;">Coffee cooling</h3>
    <span class="text-small">T(t) = Tₐ + (T₀ − Tₐ)·e⁻ᵏᵗ</span>
  </div>
  <div class="row">
    <label class="form-label" for="sim-cooling-rate" style="margin: 0;">Cooling rate</label>
    <input id="sim-cooling-rate" name="rate" type="range" min="2" max="30" step="1" value="10">
    <output data-viz-out="rate"></output>
  </div>
  <div class="row">
    <label class="form-label" for="sim-cooling-minutes" style="margin: 0;">Window</label>
    <input id="sim-cooling-minutes" name="minutes" type="range" min="15" max="120" step="5" value="60">
    <output data-viz-out="minutes"></output>
  </div>
  <div class="stats">
    <div>
      <div class="text-small">Temp at window end</div>
      <div class="viz-stat-value" data-viz-out="end">—</div>
    </div>
    <div>
      <div class="text-small">Drinkable (≤60°C) after</div>
      <div class="viz-stat-value" data-viz-out="drink">—</div>
    </div>
  </div>
  <!-- Two-beat entrance: the container (axes, grid) fades in first, then the
       line sweeps across it. animation, not transition, so it self-runs. -->
  <div style="height: 220px; animation: sim-cooling-fade 300ms ease-out;"><canvas id="sim-cooling-plot"></canvas></div>
  <style>@keyframes sim-cooling-fade { from { opacity: 0; } }</style>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script>
(function () {
  // Newton's cooling: T(t) = Ta + (T0 - Ta) * e^(-kt), coffee starting hot.
  var T0 = 90, TA = 22, DRINKABLE = 60;
  var deg = { digits: 0, unit: '°C' };

  // Canvas cannot read CSS: the theme hands the chart resolved colours.
  var plot = dshViz.chart('#sim-cooling-plot', function (theme) {
    return {
      type: 'line',
      data: { datasets: [{ borderColor: theme.series[0], backgroundColor: theme.fade(theme.series[0]), fill: true, pointRadius: 0, tension: 0.25 }] },
      options: {
        scales: {
          x: { ticks: { maxTicksLimit: 9 } },
          y: { ticks: { callback: function (v) { return dshViz.fmt(v, deg); }, maxTicksLimit: 6 } },
        },
        interaction: { mode: 'index', intersect: false },
      },
    };
  });

  // Runs now and on every slider move; what it returns fills the readouts.
  dshViz.bind('#sim-cooling', function (p) {
    var k = p.rate / 100, minutes = [], temps = [];
    for (var t = 0; t <= p.minutes; t++) {
      minutes.push(t);
      temps.push(TA + (T0 - TA) * Math.exp(-k * t));
    }
    plot.update(minutes, temps); // transitions in place; the entrance never replays
    return {
      rate: dshViz.fmt(k, { digits: 2, unit: '/min' }),
      minutes: p.minutes + ' min',
      end: dshViz.fmt(temps[temps.length - 1], deg),
      drink: dshViz.fmt(Math.log((T0 - TA) / (DRINKABLE - TA)) / k, { digits: 1, unit: ' min' }),
    };
  });
})();
</script>
